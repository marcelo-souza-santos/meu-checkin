name: Build iOS (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build iOS App
        run: |
          cd ios
          set -o pipefail
          xcodebuild build \
            -project MeuCheckin.xcodeproj \
            -scheme MeuCheckin \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee ../xcodebuild.log

      - name: Package Payload to IPA
        if: success()
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/MeuCheckin.app build/Payload/
          cd build
          zip -r meu-checkin.ipa Payload
          mkdir -p ../../dist
          cp meu-checkin.ipa ../../dist/

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meu-checkin-ios-ipa
          path: dist/meu-checkin.ipa
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log
          retention-days: 3
